name: Import WLJ Atlas

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out GitHub repository
        uses: actions/checkout@v4

      - name: Clone current ChatGPT Site source
        env:
          SOURCE_URL: ${{ secrets.SITES_SOURCE_URL }}
          SOURCE_TOKEN: ${{ secrets.SITES_SOURCE_TOKEN }}
        run: |
          git -c http.extraHeader="Authorization: Bearer ${SOURCE_TOKEN}" clone --depth 1 --branch main "${SOURCE_URL}" /tmp/wlj-source
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/wlj-source/ ./
          touch dist/.nojekyll
          sed -i "s/with seventy sequences/with one hundred sequences/" README.md
          sed -i "s/## Version 1.3.0 — fifty sequences/## Version 1.3.0 — one hundred sequences/" README.md

      - name: Commit the atlas
        run: |
          git config user.name "Rémi Eismann"
          git config user.email "7347845+decompwlj@users.noreply.github.com"
          git add -A
          git commit -m "Publish the complete WLJ Atlas"
          git push origin main

      - name: Create GitHub Pages branch
        run: |
          git subtree split --prefix dist -b gh-pages
          git push --force origin gh-pages
